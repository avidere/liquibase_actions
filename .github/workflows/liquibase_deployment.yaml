name: liquibase CI/CD Deployment

on:
  workflow_dispatch:
    inputs:
      changeLogFile:
        required: true
        default: 'changelog/changelog.xml'

      mode:
        required: true
        default: 'CI'
        type: choice
        options:
          - CI
          - CD

      environment:
        description: 'Select Environment'
        required: true
        type: choice
        options:
          - DEV
          - UAT
          - PROD

jobs:
  liquibase:
    uses: ./.github/workflows/liquibase_reusable_action.yaml
    with:
      changeLogFile: ${{ inputs.changeLogFile }}
      ci_flowfile: ${{ inputs.mode == 'CI' && 'liquibase-ci.flowfile.yaml' || '' }}
      cd_flowfile: ${{ inputs.mode == 'CD' && 'liquibase-cd.flowfile.yaml' || '' }}
    secrets: inherit   # 🔥 IMPORTANT
