name: Liquibase CICD Reusable

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      changeLogFile:
        required: true
        type: string
      ci_flowfile:
        required: false
        type: string
      cd_flowfile:
        required: false
        type: string

jobs:
  liquibase:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v3

      - name: Setup Liquibase
        run: |
          wget https://github.com/liquibase/liquibase/releases/download/v4.33.0/liquibase-4.33.0.zip
          unzip liquibase-4.33.0.zip -d liquibase
          echo "$PWD/liquibase" >> $GITHUB_PATH

      # 🔐 Truststore
      - name: Setup Truststore
        run: |
          echo "${{ secrets.SNOWFLAKE_TRUSTSTORE_BASE64 }}" | base64 -d > truststore.jks

      - name: Set JAVA_OPTS
        run: |
          echo "JAVA_OPTS=-Djavax.net.ssl.trustStore=$PWD/truststore.jks -Djavax.net.ssl.trustStorePassword=${{ secrets.SNOWFLAKE_TRUSTSTORE_PASSWORD }}" >> $GITHUB_ENV

      # 🔥 Dynamic properties
      - name: Create liquibase.properties
        run: |
          echo "url=${{ secrets.SNOWFLAKE_URL }}" > liquibase.properties
          echo "username=${{ secrets.SNOWFLAKE_USERNAME }}" >> liquibase.properties
          echo "password=${{ secrets.SNOWFLAKE_PASSWORD }}" >> liquibase.properties
          echo "driver=net.snowflake.client.jdbc.SnowflakeDriver" >> liquibase.properties
          echo "liquibaselicensekey=${{ secrets.LIQUIBASE_LICENSE_KEY }}" >> liquibase.properties

          if [ -n "${{ secrets.SNOWFLAKE_SCHEMA }}" ]; then
            echo "defaultSchemaName=${{ secrets.SNOWFLAKE_SCHEMA }}" >> liquibase.properties
          fi

          if [ -n "${{ secrets.SNOWFLAKE_WAREHOUSE }}" ]; then
            echo "warehouse=${{ secrets.SNOWFLAKE_WAREHOUSE }}" >> liquibase.properties
          fi

          if [ -n "${{ secrets.SNOWFLAKE_ROLE }}" ]; then
            echo "role=${{ secrets.SNOWFLAKE_ROLE }}" >> liquibase.properties
          fi

          echo "contexts=${{ inputs.environment }}" >> liquibase.properties
          echo "labels=${{ inputs.environment }}" >> liquibase.properties
          echo "logLevel=info" >> liquibase.properties

      # 🔍 Policy Check
      - name: Policy Check validation 
        id: validate
        continue-on-error: true
        run: |
          liquibase --defaultsFile=liquibase.properties checks run --changeLogFile=${{ inputs.changeLogFile }}

      - name: Upload checks Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: Policy_checks_output.txt

      - name: Approval on Validation Failure
        if: steps.validate.outcome == 'failure'
        uses: trstringer/manual-approval@v1
        with:
          approvers: your-github-username

      # 🔁 CI FLOW
      - name: Run CI Flow
        if: inputs.ci_flowfile != ''
        run: |
          liquibase --defaultsFile=liquibase.properties \
            --changeLogFile=${{ inputs.changeLogFile }} \
            flow --flow-file=${{ inputs.ci_flowfile }}

      # 🧾 SQL REVIEW
      - name: Generate Update SQL
        run: |
          liquibase --defaultsFile=liquibase.properties \
            --changeLogFile=${{ inputs.changeLogFile }} \
            updateSQL > updatesql.txt

      - name: Upload SQL
        uses: actions/upload-artifact@v4
        with:
          name: update-sql
          path: updatesql.txt

      # ⛔ Approval before deploy
      - name: Approval Before Deploy
        uses: trstringer/manual-approval@v1
        with:
          approvers: your-github-username

      # 🚀 CD FLOW
      - name: Run CD Flow
        if: inputs.cd_flowfile != ''
        run: |
          liquibase --defaultsFile=liquibase.properties \
            --changeLogFile=${{ inputs.changeLogFile }} \
            flow --flow-file=${{ inputs.cd_flowfile }}
