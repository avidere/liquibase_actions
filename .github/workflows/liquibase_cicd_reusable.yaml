name: Liquibase Reusable Action (Enterprise)

on:
  workflow_call:
    inputs:
      changeLogFile:
        required: true
        type: string
      ci_flowfile:
        required: false
        type: string
      cd_flowfile:
        required: false
        type: string
      environment:
        required: true
        type: string

jobs:

  # =========================
  # 1. CI + SQL REVIEW
  # =========================
  liquibase-ci:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    outputs:
      proceed: ${{ steps.set-output.outputs.proceed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Liquibase
        run: |
          wget https://github.com/liquibase/liquibase/releases/download/v4.33.0/liquibase-4.33.0.zip
          unzip liquibase-4.33.0.zip -d liquibase
          echo "$PWD/liquibase" >> $GITHUB_PATH

      # Truststore
      - name: Setup Truststore
        run: |
          echo "${{ secrets.SNOWFLAKE_TRUSTSTORE_BASE64 }}" | base64 -d > truststore.jks

      - name: Set JAVA_OPTS
        run: |
          echo "JAVA_OPTS=-Djavax.net.ssl.trustStore=$PWD/truststore.jks -Djavax.net.ssl.trustStorePassword=${{ secrets.SNOWFLAKE_TRUSTSTORE_PASSWORD }}" >> $GITHUB_ENV

      # Properties
      - name: Create liquibase.properties
        run: |
          cat <<EOF > liquibase.properties
          url=${{ secrets.SNOWFLAKE_URL }}
          username=${{ secrets.SNOWFLAKE_USERNAME }}
          password=${{ secrets.SNOWFLAKE_PASSWORD }}
          driver=net.snowflake.client.jdbc.SnowflakeDriver
          liquibaselicensekey=${{ secrets.LIQUIBASE_LICENSE_KEY }}
          EOF

      # CI FLOW
      - name: Run CI Flow
        if: ${{ inputs.ci_flowfile != '' }}
        run: |
          liquibase --defaultsFile=liquibase.properties \
            --changeLogFile=${{ inputs.changeLogFile }} \
            flow --flow-file=${{ inputs.ci_flowfile }}

      # SQL REVIEW
      - name: Generate Update SQL
        run: |
          liquibase --defaultsFile=liquibase.properties \
            --changeLogFile=${{ inputs.changeLogFile }} \
            updateSQL > updatesql.txt

      # Upload artifact
      - name: Upload SQL Review Artifact
        uses: actions/upload-artifact@v4
        with:
          name: updatesql
          path: updatesql.txt

      # Dummy output to allow next job
      - name: Set output
        id: set-output
        run: echo "proceed=true" >> $GITHUB_OUTPUT


  # =========================
  # 2. APPROVAL GATE
  # =========================
  approval:
    needs: liquibase-ci
    runs-on: ubuntu-latest

    # 🔥 THIS IS THE APPROVAL CONTROL
    environment:
      name: approval-env

    steps:
      - name: Approval Step
        run: |
          echo "Go to Actions → Artifacts → Download updatesql.txt"
          echo "Review SQL before approving deployment"


  # =========================
  # 3. CD EXECUTION
  # =========================
  liquibase-cd:
    needs: approval
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Liquibase
        run: |
          wget https://github.com/liquibase/liquibase/releases/download/v4.33.0/liquibase-4.33.0.zip
          unzip liquibase-4.33.0.zip -d liquibase
          echo "$PWD/liquibase" >> $GITHUB_PATH

      - name: Setup Truststore
        run: |
          echo "${{ secrets.SNOWFLAKE_TRUSTSTORE_BASE64 }}" | base64 -d > truststore.jks

      - name: Set JAVA_OPTS
        run: |
          echo "JAVA_OPTS=-Djavax.net.ssl.trustStore=$PWD/truststore.jks -Djavax.net.ssl.trustStorePassword=${{ secrets.SNOWFLAKE_TRUSTSTORE_PASSWORD }}" >> $GITHUB_ENV

      - name: Create liquibase.properties
        run: |
          cat <<EOF > liquibase.properties
          url=${{ secrets.SNOWFLAKE_URL }}
          username=${{ secrets.SNOWFLAKE_USERNAME }}
          password=${{ secrets.SNOWFLAKE_PASSWORD }}
          driver=net.snowflake.client.jdbc.SnowflakeDriver
          liquibaselicensekey=${{ secrets.LIQUIBASE_LICENSE_KEY }}
          EOF

      # CD FLOW
      - name: Run CD Flow
        if: ${{ inputs.cd_flowfile != '' }}
        run: |
          liquibase --defaultsFile=liquibase.properties \
            --changeLogFile=${{ inputs.changeLogFile }} \
            flow --flow-file=${{ inputs.cd_flowfile }}

      # Rollback on failure
      - name: Rollback
        if: failure()
        run: |
          liquibase --defaultsFile=liquibase.properties \
            --changeLogFile=${{ inputs.changeLogFile }} \
            rollbackCount 1
