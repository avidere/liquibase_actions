name: Liquibase Reusable Action

on:
  workflow_call:
    inputs:
      changeLogFile:
        required: true
        type: string
      cd_flowfile:
        required: false
        type: string
      ci_flowfile:
        required: false
        type: string
      environment:
        required: true
        type: string   # 🔥 REQUIRED FIX

jobs:
  liquibase-Execution:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}   # 🔥 FIXED

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Liquibase
        run: |
          wget https://github.com/liquibase/liquibase/releases/download/v4.33.0/liquibase-4.33.0.zip
          unzip liquibase-4.33.0.zip -d liquibase
          echo "$PWD/liquibase" >> $GITHUB_PATH

      # Truststore
      - name: Setup Truststore
        run: |
          echo "${{ secrets.SNOWFLAKE_TRUSTSTORE_BASE64 }}" | base64 -d > truststore.jks

      - name: Set JAVA_OPTS
        run: |
          echo "JAVA_OPTS=-Djavax.net.ssl.trustStore=$PWD/truststore.jks -Djavax.net.ssl.trustStorePassword=${{ secrets.SNOWFLAKE_TRUSTSTORE_PASSWORD }}" >> $GITHUB_ENV

      # Dynamic liquibase.properties
      - name: Create liquibase.properties
        run: |
          cat <<EOF > liquibase.properties
          url=${{ secrets.SNOWFLAKE_URL }}
          username=${{ secrets.SNOWFLAKE_USERNAME }}
          password=${{ secrets.SNOWFLAKE_PASSWORD }}
          driver=net.snowflake.client.jdbc.SnowflakeDriver
          liquibaselicensekey=${{ secrets.LIQUIBASE_LICENSE_KEY }}
          EOF

      # ✅ POLICY CHECK (correct command)
      - name: Run Policy Checks
        run: |
          liquibase checks run || echo "POLICY_FAILED=true" >> $GITHUB_ENV

      # ✅ SQL REVIEW
      - name: Generate Update SQL
        run: |
          liquibase updateSQL --changeLogFile=${{ inputs.changeLogFile }} > updatesql.txt

      - name: Upload SQL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: update-sql
          path: updatesql.txt

      # ✅ MANUAL APPROVAL USING ENVIRONMENT (NO THIRD PARTY)
      - name: Await Approval
        run: echo "Waiting for manual approval via environment"

      # CI Flow
      - name: Run Liquibase CI Flow
        if: ${{ inputs.ci_flowfile != '' }}
        run: |
          liquibase flow --flow-file=${{ inputs.ci_flowfile }}

      # CD Flow
      - name: Run Liquibase CD Flow
        if: ${{ inputs.cd_flowfile != '' }}
        run: |
          liquibase flow --flow-file=${{ inputs.cd_flowfile }}

      # History
      - name: Liquibase History
        run: |
          liquibase history > history.txt

      - name: Upload History
        uses: actions/upload-artifact@v4
        with:
          name: history-output
          path: history.txt
