name: Liquibase Rollback Reusable

on:
  workflow_call:
    inputs:
      environment:
        required: true
      rollback_type:
        required: true
      deployment_id:
        required: false
      changeset_id:
        required: false
      author:
        required: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v3

      - name: Setup Liquibase
        run: |
          wget https://github.com/liquibase/liquibase/releases/download/v4.33.0/liquibase-4.33.0.zip
          unzip liquibase-4.33.0.zip -d /opt/liquibase
          echo "/opt/liquibase" >> $GITHUB_PATH

      - name: Setup Truststore
        run: |
          echo "${{ secrets.TRUSTSTORE_BASE64 }}" | base64 -d > truststore.jks

      - name: Set Env
        run: |
          echo "JAVA_OPTS=-Djavax.net.ssl.trustStore=truststore.jks -Djavax.net.ssl.trustStorePassword=${{ secrets.TRUSTSTORE_PASSWORD }}" >> $GITHUB_ENV

      # 🔹 HISTORY
      - name: Get History
        run: |
          liquibase history > history.txt

      - name: Upload History
        uses: actions/upload-artifact@v4
        with:
          name: history-report
          path: history.txt

      # 🔹 GENERATE SQL (REVIEW)
      - name: Generate Rollback SQL
        run: |
          if [[ "${{ inputs.rollback_type }}" == "one-update" ]]; then
            liquibase rollback-one-update-sql \
              --deployment-id=${{ inputs.deployment_id }} > rollback.sql
          else
            liquibase rollback-one-changeset-sql \
              --changeset-id=${{ inputs.changeset_id }} \
              --changeset-author=${{ inputs.author }} > rollback.sql
          fi

      - name: Upload Rollback SQL
        uses: actions/upload-artifact@v4
        with:
          name: rollback-sql
          path: rollback.sql

      # 🔹 APPROVAL AFTER SQL REVIEW
      - name: Approval Before Rollback
        uses: trstringer/manual-approval@v1
        with:
          approvers: your-github-username

      # 🔹 EXECUTE ROLLBACK
      - name: Execute Rollback
        run: |
          if [[ "${{ inputs.rollback_type }}" == "one-update" ]]; then
            liquibase rollback-one-update \
              --deployment-id=${{ inputs.deployment_id }}
          else
            liquibase rollback-one-changeset \
              --changeset-id=${{ inputs.changeset_id }} \
              --changeset-author=${{ inputs.author }}
          fi
